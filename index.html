<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="Bas likho: chai 20, auto 80, dal 60. Baaki sab app kar dega.">
<title>Likh ke Kharcha</title>
<style>
  :root{
    --bg:#0f1110; --card:#181c1b; --text:#f3f4f6; --muted:#9ca3af;
    --accent:#2dd4bf; --accent-ink:#042f2e; --line:#27272a; --danger:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;line-height:1.4;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
  .app-container{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;flex:1;padding:14px}
  header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 14px}
  h1{font-size:20px;margin:0;display:flex;align-items:center;gap:8px}
  .sub{color:var(--muted);font-size:13px;margin:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1)}
  textarea{width:100%;min-height:80px;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:12px;font:inherit;font-size:16px}
  textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .row{display:flex;gap:8px;align-items:center}
  .btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:600;cursor:pointer;width:100%;text-align:center;transition:opacity 0.2s}
  .btn:active{opacity:0.8}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500;padding:10px 14px;font-size:13px;flex:1}
  .hint{font-size:12px;color:var(--muted);margin:8px 0 0}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:12px;padding:10px;font:inherit;font-size:14px;cursor:pointer;font-weight:500;text-align:center}
  .tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  .total-box{display:flex;justify-content:space-between;align-items:baseline}
  .total{font-size:32px;font-weight:700;letter-spacing:-.5px;color:var(--accent)}
  .total small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:6px}
  .bar{margin-top:10px}
  .bar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;color:var(--muted)}
  .track{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
  .fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
  .list-container{flex:1;overflow-y:auto;max-height:260px;padding-right:2px}
  .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .item .ico{font-size:22px;width:32px;text-align:center;background:var(--bg);border-radius:10px;padding:4px}
  .item .mid{flex:1;min-width:0}
  .item .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item select{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12px;padding:0;max-width:100%;cursor:pointer}
  .item .amt{font-weight:700;font-size:15px;white-space:nowrap;color:var(--text)}
  .x{background:transparent;border:0;color:var(--muted);font-size:16px;cursor:pointer;padding:6px;border-radius:8px}
  .x:hover{color:var(--danger);background:rgba(239,68,68,0.1)}
  .empty{color:var(--muted);text-align:center;padding:24px 0;font-size:14px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90%;font-weight:500;box-shadow:0 10px 15px -3px rgba(0,0,0,0.3)}

</style>
</head>
<body>
<div class="app-container">
  <header>
    <div>
      <h1>💸 Likh ke Kharcha</h1>
      <p class="sub">Bas likho, baaki app karega.</p>
    </div>
  </header>

  <div class="card">
    <textarea id="inp" placeholder="chai 20, auto 80, dal 60" aria-label="Kharcha likho"></textarea>
    <div style="margin-top:10px">
      <button class="btn" id="add">Jodo ➕</button>
    </div>
    <p class="hint">Comma, "aur" ya nayi line se likho. Jaise: <b>samosa 15, petrol 500 aur kirana 340</b></p>
  </div>

  <div class="tabs" role="group" aria-label="Samay chuno">
    <button class="tab" data-r="day" aria-pressed="true">Aaj</button>
    <button class="tab" data-r="month" aria-pressed="false">Is mahine</button>
    <button class="tab" data-r="all" aria-pressed="false">Sab</button>
  </div>

  <div class="card">
    <div class="total-box">
      <div class="total"><span id="tot">₹0</span></div>
      <div id="cnt" style="font-size:13px; color:var(--muted);"></div>
    </div>
    <div id="bars"></div>
  </div>

  <div class="card" style="margin-bottom:8px">
    <div class="list-container" id="list"></div>
  </div>

  <div class="row" style="margin-bottom:8px">
    <button class="btn ghost" id="csv">⬇️ Export CSV</button>
    <button class="btn ghost" id="clr">🗑️ Sab mitao</button>
  </div>

  <footer>Aapka data sirf aapke browser mein secure rehta hai[span_2](start_span)[span_2](end_span).</footer>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var CATS = {
    "Khana":        {i:"🍛", w:["chai","coffee","dal","roti","chawal","khana","lunch","dinner","nashta","breakfast","samosa","pizza","burger","biryani","sabzi","sabji","doodh","dahi","paneer","zomato","swiggy","fruit","phal","juice","maggi","thali","paratha","dosa","idli","chaat","mithai","ice cream","bhojan"]},
    "Safar":        {i:"🚌", w:["auto","bus","metro","petrol","diesel","ola","uber","rapido","cab","taxi","train","ticket","toll","parking","fuel","cng","flight","bike"]},
    "Ghar":         {i:"🏠", w:["kirana","ration","gas","bijli","electric","bill","rent","kiraya","paani","water","wifi","internet","recharge","maid","bai","sabun","soap","cylinder","grocery","sabzi mandi"]},
    "Shopping":     {i:"🛍️", w:["kapde","kapda","shoes","joote","amazon","flipkart","myntra","jeans","shirt","saree","bag","watch","shopping","meesho"]},
    "Sehat":        {i:"💊", w:["dawa","dawai","medicine","doctor","hospital","clinic","test","gym","dentist","chemist"]},
    "Padhai":       {i:"📚", w:["book","kitab","fees","fee","school","college","course","tuition","copy","pen","stationery","exam"]},
    "Maza":         {i:"🎬", w:["movie","film","netflix","game","party","outing","trip","ghoomna","concert","hotstar","spotify","gift"]},
    "Anya":         {i:"🧾", w:[]}
  };
  var ORDER = Object.keys(CATS);
  var KEY = "likh_ke_kharcha_v1";
  var items = [];
  var range = "day";
  var mem = null;

  function load(){
    try { var s = localStorage.getItem(KEY); if(s) items = JSON.parse(s) || []; } catch(e){ if(mem) items = mem; }
  }
  function save(){
    mem = items;
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){}
  }
  function pad(n){ return (n<10?"0":"")+n; }
  function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function money(n){ return "₹"+Math.round(n*100)/100; }
  function guess(name){
    var n = name.toLowerCase();
    for (var c in CATS){
      var ws = CATS[c].w;
      for (var k=0;k<ws.length;k++){ if (n.indexOf(ws[k])!==-1) return c; }
    }
    return "Anya";
  }
  function parse(text){
    var parts = text.split(/[\n,;+]| aur | and /i);
    var out = [];
    parts.forEach(function(p){
      p = p.trim();
      if(!p) return;
      var m = p.match(/(\d+(?:\.\d+)?)/);
      if(!m) return;
      var amt = parseFloat(m[1]);
      if(!(amt>0)) return;
      var name = p.replace(m[0],"").replace(/₹|rs\.?|rupay[ae]|rupee[s]?/ig,"").replace(/\s+/g," ").trim();
      if(!name) name = "Kharcha";
      name = name.charAt(0).toUpperCase()+name.slice(1);
      out.push({name:name, amt:amt});
    });
    return out;
  }
  function inRange(it){
    var now = new Date();
    if(range==="all") return true;
    if(range==="day") return it.date===iso(now);
    return it.date.slice(0,7)===iso(now).slice(0,7);
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(txt!==undefined) e.textContent = txt;
    return e;
  }
  function render(){
    var view = items.filter(inRange).sort(function(a,b){ return b.ts-a.ts; });
    var total = view.reduce(function(s,i){ return s+i.amt; },0);
    document.getElementById("tot").textContent = money(total);
    document.getElementById("cnt").textContent = view.length ? view.length+" items" : "";

    var sums = {};
    view.forEach(function(i){ sums[i.cat] = (sums[i.cat]||0)+i.amt; });
    var bars = document.getElementById("bars");
    bars.textContent = "";
    ORDER.filter(function(c){ return sums[c]; })
      .sort(function(a,b){ return sums[b]-sums[a]; })
      .forEach(function(c){
        var b = el("div","bar");
        var top = el("div","top");
        top.appendChild(el("span",null,CATS[c].i+" "+c));
        top.appendChild(el("span",null,money(sums[c])+" ("+Math.round(sums[c]/total*100)+"%)"));
        var tr = el("div","track"); var f = el("div","fill");
        f.style.width = Math.round(sums[c]/total*100)+"%";
        tr.appendChild(f); b.appendChild(top); b.appendChild(tr); bars.appendChild(b);
      });

    var list = document.getElementById("list");
    list.textContent = "";
    if(!view.length){
      list.appendChild(el("div","empty","Abhi kuch nahi. Upar likh ke jodo 👆"));
      return;
    }
    view.forEach(function(it){
      var row = el("div","item");
      row.appendChild(el("div","ico",CATS[it.cat] ? CATS[it.cat].i : "🧾"));
      var mid = el("div","mid");
      var nm = el("div","nm",it.name);
      var sel = document.createElement("select");
      sel.setAttribute("aria-label","Category badlo");
      ORDER.forEach(function(c){
        var o = document.createElement("option"); o.value=c; o.textContent=c; if(c===it.cat) o.selected=true; sel.appendChild(o);
      });
      sel.addEventListener("change", function(){ it.cat = sel.value; save(); render(); });
      var dt = it.date.split("-").reverse().slice(0,2).join("/");
      mid.appendChild(nm);
      var sub = el("div"); sub.style.fontSize="12px"; sub.style.color="var(--muted)";
      sub.appendChild(sel); sub.appendChild(document.createTextNode(" · "+dt));
      mid.appendChild(sub);
      row.appendChild(mid);
      row.appendChild(el("div","amt",money(it.amt)));
      var x = el("button","x","✕"); x.setAttribute("aria-label","Hatao");
      x.addEventListener("click", function(){
        items = items.filter(function(z){ return z.id!==it.id; }); save(); render(); toast("Hata diya");
      });
      row.appendChild(x);
      list.appendChild(row);
    });
  }
  function add(){
    var inp = document.getElementById("inp");
    var found = parse(inp.value);
    if(!found.length){ toast("Naam aur rupaye likho, jaise: chai 20"); return; }
    var now = new Date(), d = iso(now), base = now.getTime();
    found.forEach(function(f,idx){
      items.push({id: base+"-"+idx+"-"+Math.random().toString(36).slice(2,6), name:f.name, amt:f.amt, cat:guess(f.name), date:d, ts: base+idx});
    });
    save(); inp.value = ""; render();
    toast(found.length+" kharche jude ✅");
  }

  document.getElementById("add").addEventListener("click", add);
  document.getElementById("inp").addEventListener("keydown", function(e){
    if(e.key==="Enter" && (e.ctrlKey||e.metaKey)){ e.preventDefault(); add(); }
  });
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(b){
    b.addEventListener("click", function(){
      range = b.getAttribute("data-r");
      Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
        t.setAttribute("aria-pressed", t===b ? "true":"false");
      });
      render();
    });
  });
  document.getElementById("csv").addEventListener("click", function(){
    if(!items.length){ toast("Export ke liye kuch nahi hai"); return; }
    var rows = ["Date,Naam,Category,Rupaye"].concat(items.slice().sort(function(a,b){return a.ts-b.ts;}).map(function(i){
      return [i.date, '"'+i.name.replace(/"/g,'""')+'"', i.cat, i.amt].join(",");
    }));
    var blob = new Blob(["\ufeff"+rows.join("\n")], {type:"text/csv;charset=utf-8"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "kharcha.csv";
    document.body.appendChild(a); a.click(); a.remove();
  });
  document.getElementById("clr").addEventListener("click", function(){
    if(!items.length) return;
    if(confirm("Pakka sab kharche mita dein?")){ items = []; save(); render(); toast("Sab saaf"); }
  });

  load(); render();
})();
</script>
</body>
</html>
